<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .t { font: 16px Arial, sans-serif; fill: #111; }
      .h { font: 22px Arial, sans-serif; font-weight: 700; fill: #111; }
      .s { font: 14px Arial, sans-serif; fill: #333; }
      .box { fill: #fff; stroke: #111; stroke-width: 2; }
      .sub { fill: #f7f7f7; stroke: #111; stroke-width: 1.5; }
      .edge { stroke: #111; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .tag { font: 13px Arial, sans-serif; fill: #555; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#111"/>
    </marker>
  </defs>

  <text x="40" y="52" class="h">GT 1.0 — Gas Depleted Path (Ops Continuity)</text>
  <text x="40" y="78" class="s">Binding behavior: affects ops only. No economic meaning changes. No price logic changes.</text>

  <!-- GasReserve block -->
  <rect x="70" y="140" width="500" height="170" class="sub" rx="14"/>
  <text x="95" y="180" class="t">GasReserve (ETH/WETH) — ops infrastructure</text>
  <text x="95" y="215" class="s">- used for protocol operational transactions only</text>
  <text x="95" y="240" class="s">- not a user subsidy pool</text>
  <text x="95" y="265" class="s">- not liquidity coverage for price logic</text>

  <!-- Trigger -->
  <rect x="650" y="140" width="480" height="170" class="sub" rx="14"/>
  <text x="675" y="180" class="t">Trigger conditions</text>
  <text x="675" y="215" class="s">- GasReserve below minimum threshold</text>
  <text x="675" y="240" class="s">- GasReserve depleted</text>
  <text x="675" y="265" class="s">- ETH rail disabled at target threshold</text>

  <path d="M 570 225 L 650 225" class="edge"/>
  <text x="585" y="210" class="tag">observe state</text>

  <!-- Containment -->
  <rect x="70" y="350" width="1060" height="330" class="box" rx="14"/>
  <text x="95" y="395" class="t">Containment actions (mandatory)</text>

  <rect x="110" y="440" width="330" height="170" class="sub" rx="14"/>
  <text x="135" y="480" class="t">Ops may pause or delay</text>
  <text x="135" y="515" class="s">- admin operations may be delayed</text>
  <text x="135" y="540" class="s">- queued maintenance waits for gas</text>

  <rect x="470" y="440" width="320" height="170" class="sub" rx="14"/>
  <text x="495" y="480" class="t">Manual top-up path</text>
  <text x="495" y="515" class="s">- external ETH transfer by admin</text>
  <text x="495" y="540" class="s">- restores ops capability</text>

  <rect x="820" y="440" width="310" height="170" class="sub" rx="14"/>
  <text x="845" y="480" class="t">Economic invariants unchanged</text>
  <text x="845" y="515" class="s">- internal price unchanged</text>
  <text x="845" y="540" class="s">- mint logic unchanged (except oracle rule)</text>

  <path d="M 890 310 L 890 350" class="edge"/>
  <text x="905" y="335" class="tag">gas low event</text>

  <text x="95" y="640" class="s">Hard non-goals during gas depletion:</text>
  <text x="95" y="665" class="s">- no auto market buying requirement for minimum threshold</text>
  <text x="95" y="690" class="s">- no user gas subsidy paths</text>
</svg>
