<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style><![CDATA[
      .title { font: 700 28px Arial, Helvetica, sans-serif; fill:#111; }
      .subtitle { font: 14px Arial, Helvetica, sans-serif; fill:#333; }
      .label { font: 14px Arial, Helvetica, sans-serif; fill:#111; }
      .small { font: 12px Arial, Helvetica, sans-serif; fill:#333; }
      .tiny { font: 11px Arial, Helvetica, sans-serif; fill:#333; }
      .box { fill:#fff; stroke:#111; stroke-width:2; rx:14; ry:14; }
      .domain { fill:#fff; stroke:#111; stroke-width:3; rx:18; ry:18; }
      .arrow { stroke:#111; stroke-width:2.5; fill:none; }
      .dash { stroke-dasharray:6 6; }
    ]]></style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="60" class="title">GT 1.0 — Funds Flow (High-Level)</text>
  <text x="60" y="88" class="subtitle">No numbers. No formulas. Conceptual flows only. See spec/* for binding rules.</text>

  <!-- Off-chain note / transport-only -->
  <line x1="60" y1="118" x2="1140" y2="118" class="arrow dash" marker-end="url(#arrowhead)"/>
  <text x="60" y="112" class="tiny">Off-chain UI / RAG assistant are outside funds accounting (transport only)</text>

  <!-- Domain box -->
  <rect x="60" y="140" width="1080" height="520" class="domain"/>
  <text x="85" y="172" class="label">On-chain accounting domain</text>

  <!-- Core / Treasury -->
  <rect x="110" y="205" width="360" height="150" class="box"/>
  <text x="135" y="235" class="label">Core and Treasury Accounting</text>
  <text x="135" y="265" class="small">- internal ledgers</text>
  <text x="135" y="288" class="small">- mint allocation gates</text>
  <text x="135" y="311" class="small">- invariant enforcement</text>

  <!-- System Fund -->
  <rect x="520" y="205" width="300" height="150" class="box"/>
  <text x="545" y="235" class="label">System Fund (USD accounting)</text>
  <text x="545" y="265" class="small">- accounting support for price invariants</text>
  <text x="545" y="288" class="small">- funds coverage gates</text>

  <!-- Liquidity Fund -->
  <rect x="860" y="205" width="260" height="150" class="box"/>
  <text x="885" y="235" class="label">Liquidity Fund (USD accounting)</text>
  <text x="885" y="265" class="small">- liquidity coverage ledger</text>
  <text x="885" y="288" class="small">- multi-asset settlement support</text>

  <!-- Time Capital -->
  <rect x="110" y="390" width="360" height="140" class="box"/>
  <text x="135" y="420" class="label">Time Capital (protocol-native)</text>
  <text x="135" y="450" class="small">- inventory source for purchases</text>
  <text x="135" y="473" class="small">- mint redirection destination</text>

  <!-- Vault / Time Safe -->
  <rect x="520" y="390" width="300" height="140" class="box"/>
  <text x="545" y="420" class="label">Vault / Time Safe (aggregated)</text>
  <text x="545" y="450" class="small">- aggregated unclaimed accrual</text>
  <text x="545" y="473" class="small">- claim enabled after verification</text>

  <!-- Stability Fund -->
  <rect x="860" y="390" width="260" height="140" class="box"/>
  <text x="885" y="420" class="label">Stability Fund (stability window)</text>
  <text x="885" y="450" class="small">- stability standard enforcement</text>
  <text x="885" y="473" class="small">- non-reflexive behavior</text>

  <!-- Emergency Asset Segregation -->
  <rect x="110" y="560" width="1010" height="80" class="box"/>
  <text x="135" y="590" class="label">Emergency Asset Segregation (Level 1 and Level 2)</text>
  <text x="135" y="615" class="small">- isolates suspended or high-risk assets; does not change internal price logic</text>

  <!-- Arrows: Core -> System -->
  <line x1="470" y1="280" x2="520" y2="280" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="488" y="270" class="tiny">accounting transfer</text>

  <!-- Arrows: System -> Liquidity -->
  <line x1="820" y1="280" x2="860" y2="280" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="742" y="270" class="tiny">USD-equivalent coverage (accounting move)</text>

  <!-- Arrow: Core -> Time Capital (mint redirect) -->
  <line x1="290" y1="355" x2="290" y2="390" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="304" y="378" class="tiny">mint redirect</text>

  <!-- Arrow: System -> Vault (record accrual) -->
  <line x1="670" y1="355" x2="670" y2="390" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="685" y="378" class="tiny">record accrual</text>

  <!-- Arrow: Liquidity -> Stability (stability gating) -->
  <line x1="990" y1="355" x2="990" y2="390" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="1006" y="378" class="tiny">stability gating</text>

  <!-- Arrow: Vault -> Emergency segregation (containment only) -->
  <line x1="670" y1="530" x2="670" y2="560" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="685" y="552" class="tiny">segregation is containment only</text>

  <!-- Arrow: Stability -> Emergency segregation (containment only) -->
  <line x1="990" y1="530" x2="990" y2="560" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="1006" y="552" class="tiny">segregation is containment only</text>
</svg>
