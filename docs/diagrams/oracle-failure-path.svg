<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .t { font: 16px Arial, sans-serif; fill: #111; }
      .h { font: 22px Arial, sans-serif; font-weight: 700; fill: #111; }
      .s { font: 14px Arial, sans-serif; fill: #333; }
      .box { fill: #fff; stroke: #111; stroke-width: 2; }
      .sub { fill: #f7f7f7; stroke: #111; stroke-width: 1.5; }
      .edge { stroke: #111; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .tag { font: 13px Arial, sans-serif; fill: #555; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#111"/>
    </marker>
  </defs>

  <text x="40" y="52" class="h">GT 1.0 — Oracle Failure Path (Containment)</text>
  <text x="40" y="78" class="s">Binding behavior: pause issuance and redirect mint. No forced conversions. No sell-offs.</text>

  <!-- Trigger block -->
  <rect x="70" y="150" width="620" height="160" class="sub" rx="14"/>
  <text x="95" y="190" class="t">Trigger conditions (oracle invalid)</text>
  <text x="95" y="225" class="s">- stale timestamp</text>
  <text x="95" y="250" class="s">- inconsistent feeds</text>
  <text x="95" y="275" class="s">- missing or out-of-range answer</text>

  <!-- Oracle adapter -->
  <rect x="770" y="150" width="360" height="160" class="sub" rx="14"/>
  <text x="795" y="190" class="t">Oracle Adapter (read-only valuation)</text>
  <text x="795" y="225" class="s">validates freshness and consistency</text>
  <text x="795" y="250" class="s">normalizes feeds</text>
  <text x="795" y="275" class="s">provides reference valuation only</text>

  <!-- Arrow trigger -> oracle adapter -->
  <path d="M 690 230 L 770 230" class="edge"/>
  <text x="700" y="215" class="tag">detect invalid</text>

  <!-- Containment actions -->
  <rect x="70" y="360" width="1060" height="320" class="box" rx="14"/>
  <text x="95" y="405" class="t">Containment actions (mandatory)</text>

  <!-- Action boxes -->
  <rect x="110" y="450" width="300" height="160" class="sub" rx="14"/>
  <text x="135" y="490" class="t">Pause valuation issuance</text>
  <text x="135" y="525" class="s">- issuancePaused = true</text>
  <text x="135" y="550" class="s">- no issuance outputs while invalid</text>

  <rect x="450" y="450" width="340" height="160" class="sub" rx="14"/>
  <text x="475" y="490" class="t">Redirect mint to Time Capital</text>
  <text x="475" y="525" class="s">- mint redirected (per spec)</text>
  <text x="475" y="550" class="s">- no reflexive mint adjustment</text>

  <rect x="830" y="450" width="300" height="160" class="sub" rx="14"/>
  <text x="855" y="490" class="t">Keep internal price unchanged</text>
  <text x="855" y="525" class="s">- no forced conversion</text>
  <text x="855" y="550" class="s">- no sell-offs</text>

  <!-- Arrow oracle adapter -> containment -->
  <path d="M 950 310 L 950 360" class="edge"/>
  <text x="965" y="340" class="tag">invalid signal</text>

  <!-- Guardrails -->
  <text x="95" y="640" class="s">Hard non-goals during oracle failure:</text>
  <text x="95" y="665" class="s">- no liquidation or forced conversion logic</text>
  <text x="95" y="690" class="s">- no price collapse behavior triggered by oracle</text>
</svg>
