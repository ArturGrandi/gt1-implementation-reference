<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>

  <text x="60" y="70" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111">
    GT 1.0 — Architecture Overview (System Boundaries)
  </text>
  <text x="60" y="102" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#444">
    No numbers. No formulas. No tokenomics. One diagram = boundaries + mandatory paths.
  </text>

  <!-- ON-CHAIN boundary -->
  <rect x="60" y="140" width="980" height="700" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="8 6" rx="16" ry="16"/>
  <text x="90" y="175" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111">ON-CHAIN (Controlled Reference Implementation)</text>
  <text x="90" y="198" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555">
    Binding behavior is defined by /spec/*.md. Genesis constants are defined only in spec/genesis.md.
  </text>

  <!-- OFF-CHAIN boundary -->
  <rect x="1080" y="140" width="260" height="700" fill="#fff" stroke="#111" stroke-width="2" stroke-dasharray="8 6" rx="16" ry="16"/>
  <text x="1110" y="175" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111">OFF-CHAIN</text>
  <text x="1110" y="198" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#555">
    UI + RAG Assistant (Read-only AI + Guided Actions)
  </text>

  <!-- Off-chain blocks -->
  <rect x="1100" y="240" width="220" height="110" fill="#fff" stroke="#666" stroke-width="1.5" rx="14" ry="14"/>
  <text x="1120" y="270" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111">Protocol UI (Chat)</text>
  <text x="1120" y="295" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Guided actions only</text>
  <text x="1120" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">No keys, no signing</text>

  <rect x="1100" y="380" width="220" height="150" fill="#fff" stroke="#666" stroke-width="1.5" rx="14" ry="14"/>
  <text x="1120" y="410" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111">RAG Assistant (GPT)</text>
  <text x="1120" y="435" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Spec-grounded answers</text>
  <text x="1120" y="458" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Read-only analytics</text>
  <text x="1120" y="481" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">No state mutation</text>

  <rect x="1100" y="560" width="220" height="120" fill="#fff" stroke="#666" stroke-width="1.5" rx="14" ry="14"/>
  <text x="1120" y="590" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111">Off-chain Inputs</text>
  <text x="1120" y="615" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Oracle publishers</text>
  <text x="1120" y="638" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">DAO multisig ops</text>

  <!-- Core contracts -->
  <rect x="90" y="240" width="420" height="260" fill="#fff" stroke="#111" stroke-width="2" rx="14" ry="14"/>
  <text x="110" y="270" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111">Core Contracts</text>

  <rect x="120" y="295" width="170" height="70" fill="#fff" stroke="#666" stroke-width="1.5" rx="14" ry="14"/>
  <text x="135" y="325" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Token (GUCT)</text>
  <text x="135" y="348" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Interface only</text>

  <rect x="310" y="295" width="170" height="70" fill="#fff" stroke="#666" stroke-width="1.5" rx="14" ry="14"/>
  <text x="325" y="325" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Treasury (DAO)</text>
  <text x="325" y="348" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Allocations / approvals</text>

  <rect x="120" y="385" width="170" height="85" fill="#fff" stroke="#666" stroke-width="1.5" rx="14" ry="14"/>
  <text x="135" y="415" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Vault / Time Safe</text>
  <text x="135" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Unverified accrual</text>
  <text x="135" y="458" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Claim on verification</text>

  <rect x="310" y="385" width="170" height="85" fill="#fff" stroke="#666" stroke-width="1.5" rx="14" ry="14"/>
  <text x="325" y="415" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Time Capital</text>
  <text x="325" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Mint redirect sink</text>
  <text x="325" y="458" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Purchase inventory</text>

  <!-- Funds -->
  <rect x="540" y="240" width="470" height="260" fill="#fff" stroke="#111" stroke-width="2" rx="14" ry="14"/>
  <text x="560" y="270" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111">Funds (USD-accounting ledgers)</text>

  <rect x="570" y="295" width="180" height="70" fill="#fff" stroke="#666" stroke-width="1.5" rx="14" ry="14"/>
  <text x="585" y="325" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">System Fund</text>
  <text x="585" y="348" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Coverage gate source</text>

  <rect x="770" y="295" width="200" height="70" fill="#fff" stroke="#666" stroke-width="1.5" rx="14" ry="14"/>
  <text x="785" y="325" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Liquidity Fund</text>
  <text x="785" y="348" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Coverage destination</text>

  <rect x="570" y="385" width="180" height="85" fill="#fff" stroke="#666" stroke-width="1.5" rx="14" ry="14"/>
  <text x="585" y="415" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Stability Bucket</text>
  <text x="585" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Stability standard</text>
  <text x="585" y="458" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Mint-gates</text>

  <rect x="770" y="385" width="200" height="85" fill="#fff" stroke="#666" stroke-width="1.5" rx="14" ry="14"/>
  <text x="785" y="415" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Emergency Segregation</text>
  <text x="785" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Level 1 + Level 2</text>
  <text x="785" y="458" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Isolation only</text>

  <!-- Asset registry + Oracles -->
  <rect x="90" y="525" width="420" height="190" fill="#fff" stroke="#111" stroke-width="2" rx="14" ry="14"/>
  <text x="110" y="555" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111">AssetRegistry + Oracles</text>

  <rect x="120" y="580" width="170" height="70" fill="#fff" stroke="#666" stroke-width="1.5" rx="14" ry="14"/>
  <text x="135" y="610" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">AssetRegistry</text>
  <text x="135" y="633" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">stablecoin-agnostic</text>

  <rect x="310" y="580" width="170" height="70" fill="#fff" stroke="#666" stroke-width="1.5" rx="14" ry="14"/>
  <text x="325" y="610" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Oracle Adapter</text>
  <text x="325" y="633" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Reference-only feeds</text>

  <rect x="120" y="660" width="360" height="40" fill="#f3f3f3" stroke="#111" stroke-width="1.5" rx="18" ry="18"/>
  <text x="140" y="686" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">
    Oracle failure ⇒ pause issuance + redirect mint; NO sell-offs; price unchanged
  </text>

  <!-- GasReserve -->
  <rect x="540" y="525" width="470" height="190" fill="#fff" stroke="#111" stroke-width="2" rx="14" ry="14"/>
  <text x="560" y="555" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111">GasReserve (Ops Only)</text>

  <rect x="570" y="580" width="220" height="70" fill="#fff" stroke="#666" stroke-width="1.5" rx="14" ry="14"/>
  <text x="585" y="610" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">GasReserve (ETH/WETH)</text>
  <text x="585" y="633" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Protocol ops only</text>

  <rect x="800" y="580" width="190" height="70" fill="#fff" stroke="#666" stroke-width="1.5" rx="14" ry="14"/>
  <text x="815" y="610" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">ETH TC Rail Toggle</text>
  <text x="815" y="633" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Enable/disable gate</text>

  <rect x="570" y="660" width="420" height="40" fill="#f3f3f3" stroke="#111" stroke-width="1.5" rx="18" ry="18"/>
  <text x="590" y="686" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">
    No social tx subsidy. Users pay their own gas. Ops continuity only.
  </text>

  <!-- Footer -->
  <text x="60" y="870" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">
    Diagram is descriptive for boundaries and mandatory paths; implementation details live in /spec/*.md.
  </text>
</svg>
